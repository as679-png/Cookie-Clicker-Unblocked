<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Roblox Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="logo">ROBLOX_LOCAL</div>
        <nav>
            <a href="#" class="active">Discover</a>
            <a href="#">Avatar Shop</a>
            <a href="#">Create</a>
            <a href="#">Robux</a>
        </nav>
        <div class="search-bar">
            <input type="text" placeholder="Search games...">
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="container">
        
        <!-- Featured 3D Game Player Section -->
        <section class="player-section">
            <h2>Now Playing: 3D Platformer Prototype</h2>
            <div class="game-window">
                <!-- Simple 3D Canvas Placeholder -->
                <canvas id="gameCanvas"></canvas>
                <div class="game-ui">
                    <p>Use <strong>WASD</strong> or <strong>Arrow Keys</strong> to move the cube.</p>
                </div>
            </div>
        </section>

        <!-- Roblox-Style Grid of Games -->
        <section class="games-marketplace">
            <h2>Recommended For You</h2>
            <div class="game-grid">
                <!-- Generated Game Cards -->
                <div class="game-card">
                    <div class="game-thumb platformer"></div>
                    <h3>3D Platformer Obby</h3>
                    <p>👍 94% | 👤 12.5K</p>
                </div>
                <div class="game-card">
                    <div class="game-thumb tycoon"></div>
                    <h3>Mega Mansion Tycoon</h3>
                    <p>👍 88% | 👤 45.2K</p>
                </div>
                <div class="game-card">
                    <div class="game-thumb simulator"></div>
                    <h3>Pet Training Sim</h3>
                    <p>👍 91% | 👤 8.9K</p>
                </div>
                <div class="game-card">
                    <div class="game-thumb anime"></div>
                    <h3>Anime Fighting Ultra</h3>
                    <p>👍 95% | 👤 85.0K</p>
                </div>
                <!-- Duplicate this card structure to add more games -->
            </div>
        </section>
    </main>

    <!-- Basic 3D Script Logic -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        canvas.width = 800;
        canvas.height = 400;

        // Simple 3D projection variables for a moving cube
        let posX = 0, posY = 0, posZ = 0;
        let keys = {};

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function drawCube(x, y, z, size) {
            // Simple pseudo-3D perspective calculation
            let perspective = 400 / (400 + z);
            let screenX = canvas.width / 2 + x * perspective;
            let screenY = canvas.height / 2 + y * perspective;
            let screenSize = size * perspective;

            ctx.fillStyle = '#00a2ff';
            ctx.fillRect(screenX - screenSize/2, screenY - screenSize/2, screenSize, screenSize);
            
            // Draw outline
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(screenX - screenSize/2, screenY - screenSize/2, screenSize, screenSize);
        }

        function gameLoop() {
            // Clear screen
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw a basic "3D floor" grid line perspective
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            for(let i = -5; i <= 5; i++) {
                let p1 = 400 / (400 + 0);
                let p2 = 400 / (400 + 500);
                ctx.moveTo(canvas.width/2 + (i*100)*p1, canvas.height/2 + 100*p1);
                ctx.lineTo(canvas.width/2 + (i*100)*p2, canvas.height/2 + 100*p2);
            }
            ctx.stroke();

            // Handle Input controls
            if (keys['w'] || keys['arrowup']) posZ -= 5;
            if (keys['s'] || keys['arrowdown']) posZ += 5;
            if (keys['a'] || keys['arrowleft']) posX -= 5;
            if (keys['d'] || keys['arrowright']) posX += 5;

            // Render Player Cube
            drawCube(posX, posY + 50, posZ, 40);

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
