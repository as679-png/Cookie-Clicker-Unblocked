<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker Remix</title>
    <!-- Links your external style sheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Audio Element for Sound Effect -->
    <audio id="click-sound" src="click.mp3" preload="auto"></audio>

    <!-- Baking Dashboard -->
    <div class="clicker-section" id="click-area">
        <div class="counter-container">
            <div id="cookie-count">0 cookies</div>
            <div id="cps-count">per second: 0</div>
        </div>
        <div class="cookie-wrapper">
            <div class="cookie" id="cookie-btn"></div>
        </div>
    </div>

    <!-- Right Side Upgrades Store -->
    <div class="shop-section">
        <div class="shop-header">Store Upgrades</div>
        <div class="shop-items">
            
            <div class="shop-item disabled" id="item-cursor" onclick="buyUpgrade('cursor')">
                <div class="item-details">
                    <h3>Auto-Clicker Cursor</h3>
                    <p>Clicks the cookie once every 10 seconds (+0.1 CPS)</p>
                </div>
                <div>
                    <div class="item-cost" id="cost-cursor">15</div>
                    <div class="item-count" id="count-cursor">0</div>
                </div>
            </div>

            <div class="shop-item disabled" id="item-grandma" onclick="buyUpgrade('grandma')">
                <div class="item-details">
                    <h3>Grandma</h3>
                    <p>A nice grandma to bake more cookies (+1 CPS)</p>
                </div>
                <div>
                    <div class="item-cost" id="cost-grandma">100</div>
                    <div class="item-count" id="count-grandma">0</div>
                </div>
            </div>

            <div class="shop-item disabled" id="item-bakery" onclick="buyUpgrade('bakery')">
                <div class="item-details">
                    <h3>Cookie Bakery</h3>
                    <p>Mass-produces baked goodness (+8 CPS)</p>
                </div>
                <div>
                    <div class="item-cost" id="cost-bakery">1100</div>
                    <div class="item-count" id="count-bakery">0</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Links your external JavaScript logic -->
    <script src="script.js"></script>
</body>
</html>
